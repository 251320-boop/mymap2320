
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 전체 화면 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽과 오른쪽으로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 360px;
      min-width: 300px;
      background: #fff;
      border-right: 1px solid #e5e7eb;
    }

    .header {
      padding: 24px 20px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    /* 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    #searchInput {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #4285f4;
    }

    #searchButton {
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 안내 메시지 */
    #statusMessage {
      padding: 0 20px 14px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus {
      background: #f5f8ff;
      outline: none;
    }

    .result-item h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .category {
      margin-bottom: 6px;
      color: #3578db;
      font-size: 12px;
    }

    .address {
      margin: 0 0 6px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .phone {
      color: #888;
      font-size: 12px;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #2766c7;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f1f3f5;
    }

    /* 모바일 화면 */
    @media (max-width: 600px) {
      .sidebar {
        width: 44%;
        min-width: 0;
      }

      .header {
        padding: 16px 12px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 11px;
      }

      .search-form {
        flex-direction: column;
      }

      #searchInput {
        width: 100%;
      }

      #searchButton {
        padding: 10px;
      }

      #statusMessage {
        padding: 0 12px 10px;
        font-size: 11px;
      }

      .result-item {
        padding: 12px;
      }

      .result-item h3 {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽 검색 패널 -->
    <aside class="sidebar">
      <div class="header">
        <h1>장소 찾기</h1>
        <p>원하는 장소를 검색해 보세요.</p>

        <form id="searchForm" class="search-form">
          <input
            id="searchInput"
            type="text"
            placeholder="예: 카페, 도서관, 맛집"
            aria-label="검색할 장소"
            required
          >
          <button id="searchButton" type="submit" disabled>
            검색
          </button>
        </form>
      </div>

      <div id="statusMessage" role="status" aria-live="polite">
        카카오맵을 불러오는 중입니다...
      </div>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽 지도 -->
    <main id="map" aria-label="장소 검색 지도"></main>
  </div>

  <!-- 카카오 지도 SDK -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b5f17ac43a7a03aff8d1e9719f538c4c&libraries=services&autoload=false"
    onload="handleSdkLoad()"
    onerror="handleSdkError()"
  ></script>

  <script>
    // 지도와 검색 기능에 필요한 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let markers = [];
    let mapReady = false;

    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusMessage = document.getElementById("statusMessage");

    // 안내 메시지 변경
    function setStatus(message) {
      statusMessage.textContent = message;
    }

    // SDK 파일 로드 실패 처리
    function handleSdkError() {
      mapReady = false;
      searchButton.disabled = true;

      setStatus(
        "카카오맵 SDK를 불러오지 못했습니다. 네트워크와 API 키, 사이트 도메인을 확인해 주세요."
      );
    }

    // SDK 로드가 완료된 후 호출
    function handleSdkLoad() {
      if (!window.kakao || !window.kakao.maps) {
        handleSdkError();
        return;
      }

      // 카카오 지도 SDK 초기화가 끝난 뒤 지도 생성
      kakao.maps.load(function() {
        try {
          initializeMap();
        } catch (error) {
          console.error("지도 초기화 오류:", error);
          handleSdkError();
          setStatus(
            "지도 초기화에 실패했습니다. 카카오 개발자 콘솔 설정을 확인해 주세요."
          );
        }
      });
    }

    // 지도 초기화
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      // 기본 지도 중심: 서울 시청
      const initialPosition = new kakao.maps.LatLng(
        37.566826,
        126.9786567
      );

      // 지도 생성 및 확대 레벨 설정
      map = new kakao.maps.Map(mapContainer, {
        center: initialPosition,
        level: 5
      });

      // 지도 생성 후 검색 서비스와 정보창 준비
      placesService = new kakao.maps.services.Places(map);

      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 10
      });

      // 모든 초기화가 완료된 뒤 검색 활성화
      mapReady = true;
      searchButton.disabled = false;

      setStatus("현재 위치를 확인하고 있습니다...");

      // 현재 위치 요청
      getCurrentLocation();
    }

    // 현재 위치 확인
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        setStatus(
          "이 브라우저에서는 위치 기능을 지원하지 않습니다. 장소를 검색해 보세요."
        );
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          // 현재 위치의 위도와 경도
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치를 지도 중심으로 설정
          map.setCenter(currentPosition);

          // 현재 위치 마커 표시
          new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          setStatus("현재 위치를 표시했습니다. 장소를 검색해 보세요.");
        },
        function(error) {
          // 위치 권한 거부 및 위치 확인 실패 처리
          if (error.code === error.PERMISSION_DENIED) {
            setStatus(
              "위치 권한이 거부되었습니다. 장소를 검색해 보세요."
            );
          } else if (error.code === error.TIMEOUT) {
            setStatus(
              "위치 확인 시간이 초과되었습니다. 장소를 검색해 보세요."
            );
          } else {
            setStatus(
              "현재 위치를 확인할 수 없습니다. 장소를 검색해 보세요."
            );
          }
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 이전 검색 결과 마커 제거
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 장소 검색
    function searchPlaces(keyword) {
      if (!mapReady || !placesService) {
        setStatus("지도를 준비하고 있습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const searchKeyword = keyword.trim();

      if (!searchKeyword) {
        setStatus("검색어를 입력해 주세요.");
        return;
      }

      clearMarkers();
      resultList.replaceChildren();
      setStatus("장소를 검색하고 있습니다...");

      // 카카오 장소 검색 API 호출
      placesService.keywordSearch(
        searchKeyword,
        function(data, status) {
          if (status === kakao.maps.services.Status.OK) {
            displayResults(data);
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");
          } else {
            setStatus(
              "검색에 실패했습니다. 네트워크와 API 설정을 확인해 주세요."
            );
          }
        }
      );
    }

    // 검색 결과를 목록과 지도에 표시
    function displayResults(places) {
      resultList.replaceChildren();

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function(place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        bounds.extend(position);

        // 검색 결과 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        markers.push(marker);

        // 마커를 누르면 장소 정보 표시
        kakao.maps.event.addListener(marker, "click", function() {
          showPlaceInfo(place, marker);
        });

        // 검색 결과 항목 생성
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute(
          "aria-label",
          place.place_name + " 지도에서 보기"
        );

        const title = document.createElement("h3");
        title.textContent = (index + 1) + ". " + place.place_name;
        item.appendChild(title);

        if (place.category_name) {
          const category = document.createElement("div");
          category.className = "category";
          category.textContent = place.category_name;
          item.appendChild(category);
        }

        const address = document.createElement("p");
        address.className = "address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(address);

        if (place.phone) {
          const phone = document.createElement("div");
          phone.className = "phone";
          phone.textContent = place.phone;
          item.appendChild(phone);
        }

        // 카카오맵 상세 페이지 링크
        if (place.place_url) {
          const link = document.createElement("a");

          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 자세히 보기";

          link.addEventListener("click", function(event) {
            event.stopPropagation();
          });

          item.appendChild(link);
        }

        // 목록을 누르면 지도 이동 및 정보 표시
        function selectPlace() {
          map.panTo(position);
          showPlaceInfo(place, marker);
        }

        item.addEventListener("click", selectPlace);

        // 키보드로도 검색 결과 선택 가능
        item.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPlace();
          }
        });

        resultList.appendChild(item);
      });

      // 검색 결과가 지도에 잘 보이도록 범위 조정
      if (places.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(
            Number(places[0].y),
            Number(places[0].x)
          )
        );

        map.setLevel(5);
      } else if (places.length > 1) {
        map.setBounds(bounds);
      }

      setStatus("검색 결과 " + places.length + "개를 찾았습니다.");
    }

    // 마커 위에 장소 정보 표시
    function showPlaceInfo(place, marker) {
      const content = document.createElement("div");

      content.style.cssText =
        "padding:10px 12px;max-width:220px;font-size:13px;";

      const title = document.createElement("strong");
      title.textContent = place.place_name;
      content.appendChild(title);

      const address = document.createElement("div");

      address.style.cssText =
        "margin-top:5px;color:#666;font-size:12px;";

      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.appendChild(address);

      // HTML 문자열 대신 DOM 요소로 정보창 구성
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 폼 제출 이벤트
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });
  </script>
</body>
</html>
